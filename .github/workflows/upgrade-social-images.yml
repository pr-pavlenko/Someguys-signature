name: Upgrade social feed images

on:
  push:
    paths:
      - ".github/workflows/upgrade-social-images.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  upgrade:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install image tools
        run: |
          sudo apt-get update
          sudo apt-get install -y imagemagick ffmpeg libjpeg-turbo-progs

      - name: Repair and upscale social creatives
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/social-repaired /tmp/social-upscale

          repair() {
            src="$1"
            png="$2"

            if ffmpeg -hide_banner -loglevel warning -err_detect ignore_err -y -i "$src" -frames:v 1 "$png"; then
              return 0
            fi

            if djpeg -recover "$src" > "$png.ppm"; then
              convert "$png.ppm" "$png"
              return 0
            fi

            echo "Unable to repair $src" >&2
            return 1
          }

          repair social-feed/post-1-creative-ads.jpg /tmp/social-repaired/post1.png
          repair social-feed/post-2-website.jpg /tmp/social-repaired/post2.png
          repair social-feed/post-3-automation.jpg /tmp/social-repaired/post3.png

          convert /tmp/social-repaired/post1.png \
            -filter Lanczos -resize 1080x1080! \
            -unsharp 0x0.8+0.8+0.02 -quality 92 \
            /tmp/social-upscale/post-1-creative-ads.jpg

          convert /tmp/social-repaired/post2.png \
            -filter Lanczos -resize 1080x1080! \
            -unsharp 0x0.8+0.8+0.02 -quality 92 \
            /tmp/social-upscale/post-2-website.jpg

          convert /tmp/social-repaired/post3.png \
            -filter Lanczos -resize 1200x630 \
            -background "#0b1115" -gravity center -extent 1200x630 \
            -unsharp 0x0.8+0.8+0.02 -quality 92 \
            /tmp/social-upscale/post-3-automation.jpg

          mv /tmp/social-upscale/*.jpg social-feed/

      - name: Refresh RSS media sizes
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          p = Path("social-feed/someguys-weekly.xml")
          xml = p.read_text(encoding="utf-8")

          files = [
              ("post-1-creative-ads.jpg", Path("social-feed/post-1-creative-ads.jpg").stat().st_size),
              ("post-2-website.jpg", Path("social-feed/post-2-website.jpg").stat().st_size),
              ("post-3-automation.jpg", Path("social-feed/post-3-automation.jpg").stat().st_size),
          ]

          for filename, size in files:
              xml = re.sub(
                  rf'(media:content url="[^"]*{re.escape(filename)}"[^>]*fileSize=")\d+(")',
                  rf'\g<1>{size}\2',
                  xml
              )
              xml = re.sub(
                  rf'(enclosure url="[^"]*{re.escape(filename)}" length=")\d+(")',
                  rf'\g<1>{size}\2',
                  xml
              )

          p.write_text(xml, encoding="utf-8")
          PY

      - name: Verify output
        run: |
          identify social-feed/post-1-creative-ads.jpg
          identify social-feed/post-2-website.jpg
          identify social-feed/post-3-automation.jpg
          python3 - <<'PY'
          import xml.etree.ElementTree as ET
          ET.parse("social-feed/someguys-weekly.xml")
          print("RSS XML valid")
          PY

      - name: Commit repaired upgraded files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add social-feed/post-1-creative-ads.jpg social-feed/post-2-website.jpg social-feed/post-3-automation.jpg social-feed/someguys-weekly.xml
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Repair and upgrade social feed images"
            git push
          fi

# source-repaired
